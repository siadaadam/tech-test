{{- if .Values.consumer.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "banking-app.fullname" . }}-consumer
  labels:
    {{- include "banking-app.componentLabels" (dict "component" "consumer" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      {{- include "banking-app.componentSelectorLabels" (dict "component" "consumer" "Chart" .Chart "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "banking-app.componentLabels" (dict "component" "consumer" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "banking-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.consumer.terminationGracePeriodSeconds }}
      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/consumer"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.consumer.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.consumer.port | quote }}
            - name: PROCESS_TIMEOUT_SECONDS
              value: {{ .Values.consumer.processTimeoutSeconds | quote }}
            {{- include "banking-app.commonEnv" (dict "Values" .Values "databaseSecretName" (include "banking-app.databaseSecretName" .)) | nindent 12 }}
            {{- with .Values.consumer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.consumer.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.consumer.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
