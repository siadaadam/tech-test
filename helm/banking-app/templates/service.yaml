apiVersion: v1
kind: Service
metadata:
  name: {{ include "banking-app.fullname" . }}-api
  labels:
    {{- include "banking-app.componentLabels" (dict "component" "api" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "banking-app.componentSelectorLabels" (dict "component" "api" "Chart" .Chart "Release" .Release) | nindent 4 }}
