include classpath("application.conf")

// The hostname/port ElasticMQ advertises in queue URLs it returns - must be
// resolvable by every client (the api and consumer containers), so it's the
// docker-compose service name, not 0.0.0.0.
node-address {
  protocol = http
  host = "elasticmq"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  account-events {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "account-events-dlq"
      maxReceiveCount = 5
    }
  }

  account-events-dlq {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    messageRetentionPeriod = 1209600 seconds
  }
}
